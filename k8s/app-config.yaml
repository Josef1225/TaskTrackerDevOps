apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Frontend variables
  VITE_API_BASE: ""  # Empty string for relative URLs
  VITE_USER_API: "/api/users"
  VITE_TASK_API: "/api/tasks"
  VITE_NOTIFICATION_API: "/api/notifications"
  
  # Backend service variables (for notification service)
  USER_SERVICE_URL: "http://user-service:4000"
  TASK_SERVICE_URL: "http://task-service:5000"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"